- type: entity
  parent: BaseSubdermalImplant
  id: BieselEckeckyikTranslatorImplant
  name: Bieselized Eckeckyik translator implant
  description: An implant that helps you speak and understand the humanized thaven dialect of Bieselized Eckeckyik. Doesn't make you any better at singing though...
  categories: [ HideSpawnMenu ]
  components:
  - type: TranslatorImplant
    understood:
    - BieselEckeckyik
    spoken:
    - BieselEckeckyik
    requires:
    - TauCetiBasic

- type: entity
  parent: BaseSubdermalImplant
  id: XaoroTranslatorImplant
  name: Xaorotranslator implant
  description: An implant that lets you understand Xaoro, the language of the Rodentia. Good luck making those squeak and clicks, though. It won't help with that.
  categories: [ HideSpawnMenu ]
  components:
  - type: TranslatorImplant
    understood:
    - Xaoro
    spoken:
    - Xaoro
    requires:
    - TauCetiBasic
