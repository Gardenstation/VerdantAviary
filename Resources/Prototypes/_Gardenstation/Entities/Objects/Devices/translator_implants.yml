- type: entity
  parent: BaseSubdermalImplant
  id: BieselEckeckyikTranslatorImplant
  name: Bieselized Eckeckyik translator implant
  description: An implant that helps you speak and understand the humanized thaven dialect of Bieselized Eckeckyik. Doesn't make you any better at singing though...
  categories: [ HideSpawnMenu ]
  components:
  - type: TranslatorImplant
    understood:
    - BieselEckeckyik
    spoken:
    - BieselEckeckyik
    requires:
    - TauCetiBasic


- type: entity
  parent: BaseSubdermalImplant
  id: KhorsTranslatorImplant
  name: Khörs translator implant
  description: A more advanced version of the translator implant, teaches your illiterate friends the ability to both speak and understand the galactic tongue!
  categories: [ HideSpawnMenu ]
  components:
  - type: TranslatorImplant
    understood:
    - KheseCommon
    - KheseComplex
    spoken:
    - KheseCommon