- type: entity
  parent: [ ClothingHeadBase, PowerCellSlotHighItem, TranslatorPoweredBase, BaseCentcommContraband ]
  id: ClothingHeadHatBSODuelistHat
  name: Blueshield's parade hat
  description: A large feathered hat made specially for use by officers in tradeband circles. This one comes with a diplomat language skillsoft, its brim is lined with razor-sharp plasteel.
  components:
  - type: Sprite
    sprite: _Gardenstation/Clothing/Head/Hats/bso_duelist_hat.rsi
  - type: Clothing
    sprite: _Gardenstation/Clothing/Head/Hats/bso_duelist_hat.rsi
  - type: Armor # sidegrade bso beret since it had no armor before
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.3
        Heat: 0.3
        Radiation: 0.75
        Caustic: 0.75
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: LandAtCursor
  - type: Boomerang
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 15 # nerf this to 12 probably
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Slash: 5
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: HandheldTranslator
    spoken:
    - TauCetiBasic
    - Tradeband
    - Sign
    understood:
    - TauCetiBasic
    - Tradeband
    - Sign
    requires:
    - TauCetiBasic

