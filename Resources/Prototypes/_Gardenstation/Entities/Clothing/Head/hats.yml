- type: entity
  parent: [ ClothingHeadBase, PowerCellSlotHighItem, TranslatorPoweredBase, BaseCentcommContraband ]
  id: ClothingHeadHatBSODuelistHat
  name: Blueshield's parade hat
  description: A large feathered hat made specially for use by officers in tradeband circles. This one comes with a diplomat language skillsoft, its brim is lined with razor-sharp plasteel.
  components:
  - type: Sprite
    sprite: _Gardenstation/Clothing/Head/Hats/bso_duelist_hat.rsi
  - type: Clothing
    sprite: _Gardenstation/Clothing/Head/Hats/bso_duelist_hat.rsi
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.75 # protect ya noggin from the zeds
  - type: Armor # sidegrade bso beret since it had no armor before
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.3
        Heat: 0.3
        Radiation: 0.75
        Caustic: 0.75
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: LandAtCursor
  - type: Boomerang
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 15 # nerf this to 12 probably
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Slash: 5
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: HandheldTranslator
    spoken:
    - TauCetiBasic
    - Tradeband
    - Sign
    understood:
    - TauCetiBasic
    - Tradeband
    - Sign
    requires:
    - TauCetiBasic

- type: entity
  parent: [ ClothingHeadHatCaptain ]
  id: ClothingHeadHatCapCapWhite
  name: Captain's formal cap
  description: A peaked naval officers cap, perfect for diplomatic dinners and screaming at cadets! You feel emboldened when you wear it!
  components:
  - type: Sprite
    sprite: _Gardenstation/Clothing/Head/Hats/captain_white_cap.rsi
  - type: Clothing
    sprite: _Gardenstation/Clothing/Head/Hats/captain_white_cap.rsi
  - type: Loudspeaker # channel your inner O-7 - speak with clarity and purpose.
    requiredSlot: head
    canToggle: true
    affectRadio: true
    affectChat: true
    worksInHand: true
    fontSize: 18
