- type: entity
  parent: [ClothingNeckBase, BaseCentcommContraband]
  id: ClothingNeckMantleBsoParadeMantle
  name: blueshield's parade mantle
  description: An ornate silken mantle made specially for blueshield officers. The interior is lined with durathread- perfect for a duelist.
  components:
  - type: Sprite
    sprite: _Gardenstation/Clothing/Neck/Mantles/bso_duelist_mantle.rsi
  - type: Clothing
    sprite: _Gardenstation/Clothing/Neck/Mantles/bso_duelist_mantle.rsi
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.35 # try biting through kevlar and get back to me
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.95
        Piercing: 0.95

