name: "Labels: Review"

on:
  pull_request_target:
    types: [review_requested]

jobs:
  add_label:
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-add-labels@v1.1.0
      with:
        labels: "S: Needs Review"
    - uses: actions-ecosystem/action-remove-labels@v1.1.0
      with:
        labels: "S: Needs Changes"
